name: FranProx Dubai (Neutron + SukiSU Nova)

on:
  workflow_dispatch:
  push:
    branches: [ci/franprox-neutron]

permissions:
  contents: read

concurrency:
  group: dubai-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: github
      KBUILD_BUILD_HOST: actions
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare tool cache
        id: tool-cache
        shell: bash
        run: |
          set -euo pipefail
          APT_CACHE_DIR="$RUNNER_TEMP/dubai-apt"
          CCACHE_DIR="$RUNNER_TEMP/dubai-ccache"
          echo "APT_CACHE_DIR=$APT_CACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$APT_CACHE_DIR" "$CCACHE_DIR" "$RUNNER_TEMP/neutron-clang"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore apt package cache
        id: apt-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: dubai-neutron-apt-v1-ubuntu24-${{ runner.arch }}-${{ steps.tool-cache.outputs.week }}
          restore-keys: |
            dubai-neutron-apt-v1-ubuntu24-${{ runner.arch }}-
      - name: Install build dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo chown _apt:root "$APT_CACHE_DIR/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$APT_CACHE_DIR/" -o APT::Keep-Downloaded-Packages=true -o Binary::apt-get::APT::Keep-Downloaded-Packages=true install -y --no-install-recommends bc bison flex build-essential libssl-dev libelf-dev libncurses-dev dwarves gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler cpio rsync kmod python3 curl ccache zstd
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE_DIR"
          if find "$APT_CACHE_DIR" -maxdepth 1 -type f -name '*.deb' -print -quit | grep -q .; then
            echo "has-debs=true" >> "$GITHUB_OUTPUT"
          fi
          df -h
      - name: Save apt package cache
        if: steps.apt-cache.outputs.cache-hit != 'true' && steps.deps.outputs.has-debs == 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.APT_CACHE_DIR }}/*.deb
          key: dubai-neutron-apt-v1-ubuntu24-${{ runner.arch }}-${{ steps.tool-cache.outputs.week }}
      - name: Restore Neutron Clang toolchain
        id: clang-cache
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/neutron-clang
          key: dubai-toolchain-v2-ubuntu24-${{ runner.arch }}-neutron-06092026-531083928c8e
      - name: Set up pinned Neutron Clang
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          tc="$RUNNER_TEMP/neutron-clang"
          digest=531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30
          valid_toolchain() {
            test -f "$tc/.archive-sha256" && test "$(cat "$tc/.archive-sha256")" = "$digest" || return 1
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              test -x "$tc/bin/$tool" || return 1
            done
            "$tc/bin/clang" --version
          }
          if ! valid_toolchain; then
            rm -rf "$tc"
            staging="$(mktemp -d "$RUNNER_TEMP/neutron-extract.XXXXXX")"
            archive="$RUNNER_TEMP/neutron-clang.tar.zst"
            curl -fL --retry 3 --connect-timeout 20 https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -o "$archive"
            printf '%s  %s\n' "$digest" "$archive" | sha256sum -c -
            tar --zstd -xf "$archive" -C "$staging"
            clang_path="$(find "$staging" -path '*/bin/clang' -print -quit)"
            test -n "$clang_path"
            mv "$(dirname "$(dirname "$clang_path")")" "$tc"
            rm -rf "$staging"
            rm -f "$archive"
            printf '%s\n' "$digest" > "$tc/.archive-sha256"
          fi
          mkdir -p logs
          valid_toolchain 2>&1 | tee logs/neutron-toolchain.log
          echo "$tc/bin" >> "$GITHUB_PATH"
          echo "LLVM_SUFFIX=" >> "$GITHUB_ENV"
          echo "neutron-ready=true" >> "$GITHUB_OUTPUT"
          compiler_hash="$(sha256sum "$tc/bin/clang" | cut -d ' ' -f1)"
          echo "fingerprint=$compiler_hash" >> "$GITHUB_OUTPUT"
      - name: Save Neutron Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true' && steps.compiler.outputs.neutron-ready == 'true'
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/neutron-clang
          key: dubai-toolchain-v2-ubuntu24-${{ runner.arch }}-neutron-06092026-531083928c8e
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: dubai-neutron-ccache-v2-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dubai-neutron-ccache-v2-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-
      - name: Initialize ccache
        id: ccache-init
        shell: bash
        run: |
          set -euo pipefail
          ccache --version
          ccache --max-size=3G
          ccache --zero-stats
          ccache --show-stats
      - name: Integrate pinned SukiSU Nova (Built-In)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          git clone --branch builtin-new --single-branch https://github.com/SukiSU-Nova/SukiSU-Nova.git KernelSU
          git -C KernelSU checkout --detach 5a3ec4145059ed2c4f22c70a16a28a616e104c33
          test "$(git -C KernelSU rev-parse HEAD)" = 5a3ec4145059ed2c4f22c70a16a28a616e104c33
          test -f KernelSU/kernel/Kconfig
          test ! -e drivers/kernelsu
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -e drivers/kernelsu/Kconfig
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          git -C KernelSU rev-parse HEAD | tee logs/sukisu-revision.txt
          grep -E '^KSU_(PACKAGE_NAME|EXPECTED_SIZE|EXPECTED_HASH) *:=' KernelSU/kernel/Makefile | tee logs/manager-signature.txt

      - name: Configure and compile for Motorola Edge 30 (dubai)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out logs
          clang${LLVM_SUFFIX} --version | tee logs/compiler.txt
          cfg=arch/arm64/configs/vendor
          scripts/kconfig/merge_config.sh -m -O out "$cfg/lahaina-qgki_defconfig" "$cfg/lineage_moto-lahaina.config" "$cfg/lineage_dubai.config" 2>&1 | tee logs/config-merge.log
          scripts/config --file out/.config --enable KSU --enable KPROBES --enable KALLSYMS_ALL --enable EXT4_FS --enable HEADERS_INSTALL --enable KSU_LSM_SECURITY_HOOKS --enable KSU_HEURISTIC_IN_TREE_BUILD --disable KSU_SUSFS --disable KPM --disable KSU_DEBUG --disable KSU_FEATURE_ADBROOT --disable KSU_SHELL_HAS_SU_ALWAYS --disable KSU_HACK_ARM64_BRANCH_LINK --disable KSU_TAMPER_SYSCALL_TABLE --set-str LOCALVERSION "-FranProx" --disable LOCALVERSION_AUTO
          opts=(O=out LLVM=1 LLVM_IAS=1
            "CC=ccache clang${LLVM_SUFFIX}" LD=ld.lld${LLVM_SUFFIX}
            AR=llvm-ar${LLVM_SUFFIX} NM=llvm-nm${LLVM_SUFFIX}
            OBJCOPY=llvm-objcopy${LLVM_SUFFIX} OBJDUMP=llvm-objdump${LLVM_SUFFIX}
            READELF=llvm-readelf${LLVM_SUFFIX} STRIP=llvm-strip${LLVM_SUFFIX}
            HOSTCC=clang${LLVM_SUFFIX} HOSTCXX=clang++${LLVM_SUFFIX}
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-)
          make "${opts[@]}" olddefconfig 2>&1 | tee logs/config.log
          cp out/.config logs/kernel.config
          grep -qx 'CONFIG_ARM64=y' out/.config
          grep -qx 'CONFIG_ARCH_YUPIK=y' out/.config
          for symbol in KSU KPROBES KALLSYMS_ALL EXT4_FS KSU_LSM_SECURITY_HOOKS SECURITY_SELINUX CFI_CLANG; do
            grep -qx "CONFIG_$symbol=y" out/.config
          done
          grep -qx '# CONFIG_KSU_SUSFS is not set' out/.config
          make -j"$(nproc)" "${opts[@]}" headers_install 2>&1 | tee logs/headers.log
          test -s out/usr/include/linux/unistd.h
          # Generate SELinux headers before compiling the built-in root driver.
          make -j"$(nproc)" "${opts[@]}" security/selinux/ 2>&1 | tee logs/selinux-preflight.log
          test -s out/security/selinux/flask.h
          test -s out/security/selinux/av_permissions.h
          if ! make -k -j"$(nproc)" "${opts[@]}" drivers/kernelsu/ 2>&1 | tee logs/sukisu-preflight.log; then
            {
              echo '### SukiSU compatibility preflight failed'
              echo '```text'
              grep -E 'error:|undefined reference|LLVM ERROR' logs/sukisu-preflight.log | head -n 100 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          make -j"$(nproc)" "${opts[@]}" Image dtbs modules 2>&1 | tee logs/build.log
      - name: Report ccache statistics
        if: ${{ !cancelled() && steps.ccache-init.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p logs
          ccache --show-stats | tee logs/ccache.txt
          {
            echo '### Compilation cache'
            echo
            sed 's/^/    /' logs/ccache.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save ccache (including partial builds)
        if: ${{ !cancelled() && steps.ccache-init.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: dubai-neutron-ccache-v2-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify kernel artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/Module.symvers
          readelf -h out/vmlinux | tee logs/elf-header.txt
          grep -q AArch64 logs/elf-header.txt
          python3 -c 'from pathlib import Path; p=Path("out/arch/arm64/boot/Image"); f=p.open("rb"); f.seek(56); assert f.read(4)==b"ARM\x64", "Invalid ARM64 Image magic"'
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/
          cp out/.config artifacts/kernel.config
          cp out/Module.symvers out/System.map artifacts/
          find out/arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print | sort | tee logs/device-trees.txt
          test -s logs/device-trees.txt
          tar -czf artifacts/device-trees.tar.gz -T logs/device-trees.txt
          find out -type f -name '*.ko' -print | sort | tee logs/modules.txt
          test -s logs/modules.txt
          printf '%s\n' aw882xx_k504.ko va_macro_dlkm.ko fc0013.ko lzo-rle.ko wcd_core_dlkm.ko lzo_compress.ko q6_notifier_dlkm.ko mt20xx.ko fc0012.ko tea5767.ko platform_dlkm.ko lzo_decompress.ko mt2063.ko wsa883x_dlkm.ko tda18250.ko mxl301rf.ko bt_fm_slim.ko q6_dlkm.ko mt2266.ko tuner-xc2028.ko camera.ko qm1d1c0042.ko wcd938x_slave_dlkm.ko wcd937x_slave_dlkm.ko swr_dlkm.ko tda9887.ko tua9001.ko mbhc_dlkm.ko fc0011.ko radio-i2c-rtc6226-qca.ko mxl5007t.ko r820t.ko xc5000.ko pinctrl_lpi_dlkm.ko hid-aksys.ko swr_haptics_dlkm.ko swr_ctrl_dlkm.ko tuner-simple.ko qcom_edac.ko qm1d1b0004.ko pinctrl_wcd_dlkm.ko swr_dmic_dlkm.ko lzo.ko stub_dlkm.ko apr_dlkm.ko tda18212.ko mt2131.ko msi001.ko si2157.ko mc44s803.ko mt2060.ko hdmi_dlkm.ko tda18218.ko fc2580.ko tea5761.ko slimbus.ko slimbus-ngd.ko wcd937x_dlkm.ko rdbg.ko msm_drm.ko it913x.ko q6_pdr_dlkm.ko xc4000.ko m88rs6000t.ko adsp_loader_dlkm.ko zram.ko snd_event_dlkm.ko wsa_macro_dlkm.ko wcd938x_dlkm.ko max2165.ko native_dlkm.ko bolero_cdc_dlkm.ko mxl5005s.ko wcd9xxx_dlkm.ko tx_macro_dlkm.ko tuner-types.ko llcc_perfmon.ko e4000.ko rx_macro_dlkm.ko btpower.ko machine_dlkm.ko qt1010.ko wlan.ko rmnet_core.ko rmnet_ctl.ko rmnet_offload.ko rmnet_shs.ko utags.ko mmi_info.ko mmi_annotate.ko sensors_class.ko exfat.ko bm_adsp_ulog.ko mmi_charger.ko qti_glink_charger.ko qpnp_adaptive_charge.ko aw862x.ko mmi_relay.ko wl2864c.ko cci_intf.ko st21nfc.ko nfc_i2c.ko sx937x_sar.ko touchscreen_mmi.ko goodix_brl_mmi.ko mmi_sys_temp.ko rbs_fod_mmi.ko | sort -u > logs/expected-modules.txt
          sed 's|.*/||' logs/modules.txt | sort -u > logs/compiled-modules.txt
          comm -23 logs/expected-modules.txt logs/compiled-modules.txt | tee logs/missing-modules.txt
          test ! -s logs/missing-modules.txt
          tar -czf artifacts/modules.tar.gz -T logs/modules.txt
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          echo 'Static ARM64 kernel validation passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FranProx-Dubai-Neutron-SukiSU-Nova-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dubai-build-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
